name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and package ss-agent
        run: ./scripts/build-agent-release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/ss-agent_*.tar.gz dist/checksums.txt \
            --title "ss-agent ${VERSION} (linux-amd64)" \
            --generate-notes \
            --verify-tag
