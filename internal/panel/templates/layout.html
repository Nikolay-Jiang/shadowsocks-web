{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} - {{.Brand}}</title>
<style>
:root { color-scheme: light dark; --bg:#f6f7f9; --fg:#1f2328; --muted:#656d76; --card:#fff; --line:#d0d7de; --accent:#0969da; --ok:#1a7f37; --bad:#cf222e; }
@media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --card:#161b22; --line:#30363d; --accent:#4493f8; --ok:#3fb950; --bad:#f85149; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
nav { display:flex; gap:18px; align-items:center; padding:12px 24px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
nav .brand { font-weight:700; margin-right:12px; }
nav .spacer { flex:1; }
main { max-width:1120px; margin:24px auto; padding:0 20px 60px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:18px; }
h1 { font-size:24px; margin:0 0 8px; }
h2 { font-size:18px; margin:0 0 12px; }
.muted { color:var(--muted); }
.ok { color:var(--ok); }
.bad { color:var(--bad); }
.warn { color:#9a6700; }
.logmsg { white-space:pre-wrap; overflow-wrap:anywhere; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
.stat .n { font-size:26px; font-weight:700; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:13px; }
tr:last-child td { border-bottom:0; }
input, select, textarea { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
input[type=text], input[type=password], input[type=number], input[type=date], select { width:100%; max-width:360px; }
textarea { width:100%; }
label { display:block; margin:10px 0 4px; color:var(--muted); font-size:13px; }
.check { display:flex; gap:8px; align-items:center; margin:12px 0; }
.check input { width:auto; }
button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
button.secondary { background:transparent; color:var(--fg); border:1px solid var(--line); }
button.danger { background:var(--bad); }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.notice { padding:10px 12px; border-radius:8px; margin-bottom:16px; border:1px solid var(--line); background:var(--card); }
.notice.error { border-color:var(--bad); color:var(--bad); }
.notice.flash { border-color:var(--accent); }
code, pre { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; }
.linkbox { width:100%; max-width:none; font-family:ui-monospace,monospace; font-size:12px; }
.formgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:0 16px; }
.actions { display:flex; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>
{{if .Admin}}
<nav>
  <span class="brand">{{.Brand}}</span>
  <a href="/">Dashboard</a>
  <a href="/nodes">Nodes</a>
  <a href="/users">Users</a>
  <a href="/audit">Audit</a>
  <span class="spacer"></span>
  <span class="muted">{{.Admin}}</span>
  <form method="post" action="/logout" style="margin:0">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <button class="secondary" type="submit">Logout</button>
  </form>
</nav>
{{end}}
<main>
{{if .Error}}<div class="notice error">{{.Error}}</div>{{end}}
{{if .Flash}}<div class="notice flash">{{.Flash}}</div>{{end}}
{{template "content" .}}
</main>
<script>
function copyText(id, button) {
  const source = document.getElementById(id);
  if (!source) return;
  const text = source.textContent;
  const done = () => {
    const old = button.textContent;
    button.textContent = "Copied";
    setTimeout(() => { button.textContent = old; }, 1200);
  };
  const fallback = () => {
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); done(); } catch (_) {}
    document.body.removeChild(area);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}
</script>
</body>
</html>{{end}}
